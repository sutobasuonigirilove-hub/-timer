<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>15分タイマー</title>
  <style>
    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      text-align: center;
      background-color: #f4f7f6;
      padding: 20px;
    }
    h1 {
      color: #333;
    }
    .timer-container {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
      margin-top: 20px;
    }
    .timer-card {
      background: #fff;
      border: 2px solid #ddd;
      border-radius: 12px;
      padding: 24px;
      width: 300px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
    }
    .time-display {
      font-size: 42px;
      font-weight: bold;
      font-family: monospace;
      margin: 16px 0;
      color: #2c3e50;
    }
    .result-msg {
      min-height: 24px;
      font-size: 16px;
      font-weight: bold;
      color: #e67e22;
      margin-bottom: 16px;
    }
    .gameover {
      color: #e74c3c !important;
      animation: blink 0.8s infinite alternate;
    }
    @keyframes blink {
      from { opacity: 1; }
      to { opacity: 0.4; }
    }
    button {
      font-size: 16px;
      padding: 12px 20px;
      margin: 6px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }
    .btn-action {
      background-color: #3498db;
      color: white;
      width: 100%;
    }
    .btn-action:hover {
      background-color: #2980b9;
    }
    .btn-next {
      background-color: #2ecc71;
      color: white;
      width: 100%;
    }
    .btn-next:hover {
      background-color: #27ae60;
    }
  </style>
</head>
<body>

  <h1>15分タイマー（2レーン）</h1>

  <div class="timer-container">
    <!-- タイマー 1 -->
    <div class="timer-card" id="card-1">
      <h2>タイマー 1</h2>
      <div class="time-display" id="display-1">15:00</div>
      <div class="result-msg" id="result-1"></div>
      <button class="btn-action" id="btn-action-1" onclick="toggleTimer(1)">スタート</button>
      <button class="btn-next" onclick="resetToNext(1)">つぎのおきゃくさんへ</button>
    </div>

    <!-- タイマー 2 -->
    <div class="timer-card" id="card-2">
      <h2>タイマー 2</h2>
      <div class="time-display" id="display-2">15:00</div>
      <div class="result-msg" id="result-2"></div>
      <button class="btn-action" id="btn-action-2" onclick="toggleTimer(2)">スタート</button>
      <button class="btn-next" onclick="resetToNext(2)">つぎのおきゃくさんへ</button>
    </div>
  </div>

  <script>
    const TOTAL_SECONDS = 15 * 60; // 15分（900秒）

    // 2台分の状態管理
    const state = {
      1: { remaining: TOTAL_SECONDS, intervalId: null, isRunning: false },
      2: { remaining: TOTAL_SECONDS, intervalId: null, isRunning: false }
    };

    // ビープ音（外部音声ファイル不要）
    function playGameOverSound() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(440, audioCtx.currentTime); // 440Hz
        osc.frequency.setValueAtTime(220, audioCtx.currentTime + 0.3);

        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1.2);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime + 1.2);
      } catch (e) {
        console.error("Audio error:", e);
      }
    }

    // 表示更新
    function updateDisplay(id) {
      const mins = Math.floor(state[id].remaining / 60);
      const secs = state[id].remaining % 60;
      document.getElementById(`display-${id}`).textContent =
        `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }

    // ❶ スタート / ❷ ストップ の切り替え
    function toggleTimer(id) {
      const s = state[id];
      const actionBtn = document.getElementById(`btn-action-${id}`);
      const resultDiv = document.getElementById(`result-${id}`);

      // すでに動いている場合 -> 停止して経過時間を表示
      if (s.isRunning) {
        clearInterval(s.intervalId);
        s.isRunning = false;
        actionBtn.textContent = '再開';

        // かかった時間を計算（15分 - 残り時間）
        const elapsedSeconds = TOTAL_SECONDS - s.remaining;
        const elapsedMins = Math.floor(elapsedSeconds / 60);
        const elapsedSecs = elapsedSeconds % 60;
        resultDiv.textContent = `かかった時間: ${elapsedMins}分${elapsedSecs}秒`;
      } 
      // 停止中 -> スタート
      else {
        // ゲームオーバー状態なら何もしない
        if (s.remaining <= 0) return;

        resultDiv.textContent = '';
        s.isRunning = true;
        actionBtn.textContent = 'ストップ';

        s.intervalId = setInterval(() => {
          s.remaining--;
          updateDisplay(id);

          // ❹ 15分経過（0秒到達）でゲームオーバー
          if (s.remaining <= 0) {
            clearInterval(s.intervalId);
            s.isRunning = false;
            actionBtn.textContent = '終了';
            actionBtn.disabled = true;

            const disp = document.getElementById(`display-${id}`);
            disp.classList.add('gameover');
            resultDiv.textContent = 'ゲームオーバー！';
            resultDiv.classList.add('gameover');

            playGameOverSound();
          }
        }, 1000);
      }
    }

    // ❸ つぎのおきゃくさんへ（リセットして❶に戻る）
    function resetToNext(id) {
      const s = state[id];
      clearInterval(s.intervalId);
      s.isRunning = false;
      s.remaining = TOTAL_SECONDS;

      const actionBtn = document.getElementById(`btn-action-${id}`);
      const resultDiv = document.getElementById(`result-${id}`);
      const disp = document.getElementById(`display-${id}`);

      actionBtn.disabled = false;
      actionBtn.textContent = 'スタート';
      resultDiv.textContent = '';
      resultDiv.classList.remove('gameover');
      disp.classList.remove('gameover');

      updateDisplay(id);
    }
  </script>
</body>
</html>
